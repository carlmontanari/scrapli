---
prompt_pattern: '^[a-zA-Z0-9.\-_@/:+()]{1,63}[>#$]\s*$'
default_mode: 'privileged_exec'
modes:
  - name: 'exec'
    prompt_pattern: '^[a-zA-Z0-9.\-_@/:]{1,63}>\s*$'
    accessible_modes:
      - name: 'privileged_exec'
        instructions:
          - send_prompted_input:
              input: 'enable'
              prompt_pattern: '^[Pp]assword:\s*$'
              response: '__lookup::enable'
  - name: 'privileged_exec'
    prompt_pattern: '^[a-zA-Z0-9.\-_@/:]{1,63}#\s*$'
    accessible_modes:
      - name: 'exec'
        instructions:
          - send_input:
              input: 'disable'
      - name: 'configuration'
        instructions:
          - send_input:
              input: 'configure'
  - name: 'configuration'
    prompt_pattern: '^[a-zA-Z0-9.\-_@/:]{1,63}\([\w.\-@/:+]{0,32}\)#\s*$'
    accessible_modes:
      - name: 'privileged_exec'
        instructions:
          - send_input:
              input: 'end'
failure_indicators:
  - '% Ambiguous command'
  - '% Incomplete command'
  - '% Invalid input detected'
  - '% Unknown command'
  - '% Unrecognized command'
  - 'Syntax error'
  - '% Error'
on_open_instructions:
  - enter_mode:
      requested_mode: 'privileged_exec'
  - send_input:
      input: 'terminal datadump'
on_close_instructions:
  - enter_mode:
      requested_mode: 'privileged_exec'
  - write:
      input: 'exit'
